[project]
name = "mijn-services-tools"
version = "0.1.0"
description = "Tooling voor MijnServices aansluitprofielen en gegenereerde documentatie."
authors = [{ name = "developer.overheid.nl" }]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
  "pyyaml>=6.0.2,<7.0.0",
]

[project.scripts]
mijn-services = "mijn_services.cli:main"

[tool.poetry]
packages = [{ include = "mijn_services", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
