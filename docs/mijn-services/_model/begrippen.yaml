begrippen:
  definities:
    bericht:
      naam: BERICHT
      definitie: >-
        Digitale post dat een overheidsorganisatie naar een burger, bedrijf of instelling stuurt, waarin informatie en/of documenten worden aangeboden die de burger, het bedrijf of de instelling in de persoonlijke digitale postbus ontvangt.
    berichttype:
      naam: BERICHTTYPE
      definitie: >-
        Specificatie van vast te leggen informatie over een BERICHT.
    taakstatus:
      naam: TAAKSTATUS
      definitie: >-
        Een aanduiding van de stand van zaken van een TAAK op basis van betekenisvol behaald resultaat voor de initiator van de TAAK.
    actor:
      naam: ACTOR
      definitie: >-
        Iets dat of iemand die voor de overheidsorganisatie werkzaamheden uitvoert.
    besluit:
      naam: BESLUIT
      definitie: >-
        Een schriftelijke beslissing van een bestuursorgaan, inhoudende een publiekrechtelijke rechtshandeling.
    gesprek:
      naam: GESPREK
      definitie: >-
        Een digitale dialoog tussen een burger, bedrijf of instelling en (een) overheidsorganisatie(s).
    informatieobject:
      naam: INFORMATIEOBJECT
      definitie: >-
        Een INFORMATIEOBJECT waarvan aard, omvang en/of vorm aanleiding geven het als één geheel te behandelen en te beheren.
    klantcontact:
      naam: KLANTCONTACT
      definitie: >-
        Contactmoment tussen een burger, bedrijf of instelling en een overheidsorganisatie dat werkelijk heeft plaatsgevonden.
    partij:
      naam: PARTIJ
      definitie: >-
        Persoon of organisatie waarmee de overheidsorganisatie een relatie heeft.
    plan:
      naam: PLAN
      definitie: >-
        Een gestructureerde en vastgelegde beschrijving van doelen, keuzes, activiteiten en middelen, waarin wordt uitgewerkt wat de burger wil bereiken, hoe dat gebeurt, wanneer en met welke inzet.
    product:
      naam: PRODUCT
      definitie: >-
        Iets wat wordt voortgebracht en een concrete of herkenbare waarde heeft voor een burger, bedrijf, instelling of andere overheidsorganisatie.
    resultaat:
      naam: RESULTAAT
      definitie: >-
        Een gedefinieerde, concrete uitkomst van een ZAAK zoals het verlenen of weigeren van een vergunning, een toekenning of een afwijzing, en is het het 'antwoord' op de aanleiding van die ZAAK.
    status:
      naam: STATUS
      definitie: >-
        Een aanduiding van de stand van zaken van een ZAAK op basis van betekenisvol behaald resultaat voor de initiator van de ZAAK.
    taak:
      naam: TAAK
      definitie: >-
        Een welomschreven en afgebakende hoeveelheid werk dat iemand doet of moet doen, horende bij een ZAAK of betrekking hebbende op een PRODUCT.
    verzoek:
      naam: VERZOEK
      definitie: >-
        Een tot een overheidsorganisatie gerichte vraag of aanspraak om een bepaalde beslissing, handeling of reactie te verkrijgen.
    zaak:
      naam: ZAAK
      definitie: >-
        Een samenhangende hoeveelheid werk met een welgedefinieerde aanleiding en een welgedefinieerd eindresultaat, waarvan kwaliteit en doorlooptijd bewaakt moeten worden.
    zaaktype:
      naam: ZAAKTYPE
      definitie: >-
        Specificatie van de wijze van besturing van, en vast te leggen informatie over een bedrijfsproces dat als zaak uitgevoerd wordt.

